name: Release

# Manual only, normally dispatched by dev-scripts/release.ps1 after its preflight. Three separate downloads:
# the mod zip, bug_fables.apworld and bug_fables.yaml.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. v0.1.0 (creates this tag). Must match Plugin.cs and archipelago.json.'
        required: true
        type: string
      prerelease:
        description: 'Mark as a pre-release (hidden from Latest, so easy to miss)'
        required: false
        type: boolean
        default: false
      highlights:
        description: 'Changes and new features, above the generated notes. Empty for the generated notes alone.'
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  # First, and everything needs it: a bad version or a leaked path costs seconds, not a tag.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Inputs through env:, never ${{ }} in the script, so their text is only ever data.
      - name: Version matches the mod and the world
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if ! printf '%s' "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must look like v0.1.0, got '$VERSION'"; exit 1
          fi
          bare="${VERSION#v}"
          plugin=$(grep -oP 'Version = "\K[^"]+' mod/BugFablesAP/Core/Plugin.cs)
          world=$(python3 -c 'import json; print(json.load(open("apworld/bug_fables/archipelago.json"))["world_version"])')
          if [ "$plugin" != "$bare" ] || [ "$world" != "$bare" ]; then
            echo "::error::Plugin.cs says $plugin and archipelago.json says $world; both must be $bare"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::tag $VERSION already exists"; exit 1
          fi

      # preflight's text rules: no home path, credential, hidden character or unlisted host.
      - name: Nothing unpublishable in the release body
        env:
          HIGHLIGHTS: ${{ inputs.highlights }}
        run: |
          set -u
          fail=0
          printf '%s' "$HIGHLIGHTS" | python3 dev-scripts/preflight.py --text-stdin highlights || fail=1
          # gh sends a file's path as the text when the @ is missing.
          lines=$(printf '%s' "$HIGHLIGHTS" | grep -c '' || true)
          if [ "$lines" = "1" ] && printf '%s' "$HIGHLIGHTS" | grep -qE '^([A-Za-z]:[\\/]|[.]{0,2}/)[^ ]*$|^[^ ]+\.(md|txt)$'; then
            echo "::error::The highlights are a file path. Use: gh workflow run release.yml -F 'highlights=@notes.md'"; fail=1
          fi
          # The generated notes publish every commit subject since the last tag.
          prev=$(git tag --sort=-v:refname | head -n 1 || true)
          range="${prev:+$prev..}HEAD"
          git log --format=%s $range | python3 dev-scripts/preflight.py --text-stdin "commit subjects in $range" || fail=1
          exit $fail

  ci:
    needs: guard
    uses: ./.github/workflows/ci.yml

  # CI can't build the mod (it needs the game's own assembly), so the DLLs in release/mod are committed.
  mod-dll:
    name: Committed mod DLL matches its sources
    needs: guard
    runs-on: ubuntu-latest
    steps:
      # All history: preflight reads the sources of the commit the DLL was built from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Stale gate
        shell: pwsh
        run: ./dev-scripts/build-release.ps1 -Check

  publish:
    needs: [guard, ci, mod-dll]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apworld
          path: dist

      # Only release/mod: built-from.txt sits beside it and is a CI gate, not something a player needs.
      - name: Zip the mod
        run: |
          set -e
          (cd release/mod && zip -r -X ../../dist/bugfables-archipelago.zip BepInEx README.txt)
          unzip -l dist/bugfables-archipelago.zip
          ls -l dist

      # Pinned to a commit: it runs with contents: write. v3.0.3's tag resolves to this commit.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.version }}
          # The commit that was checked, not whatever main has become since.
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            dist/bugfables-archipelago.zip
            dist/bug_fables.apworld
            dist/bug_fables.yaml
          body: ${{ inputs.highlights }}
          generate_release_notes: true
          fail_on_unmatched_files: true
