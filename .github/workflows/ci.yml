name: CI

# Every push, and every release (release.yml calls this): the apworld's tests and Archipelago's general tests on it, on a
# Python matrix, the apworld and its yaml built and used as a player would, the fuzzer with the Logic Test check, and
# Universal Tracker's fuzzer hook. The mod DLL's stale gate runs only in release.yml: between releases, a committed DLL
# older than its sources is expected.
on:
  push:
  pull_request:
  workflow_call:

permissions: {}

env:
  AP_TAG: '0.6.8'
  # fuzz.py 0.6.2 and the Logic Test world 0.4.0: the commits development.md names.
  FUZZER_COMMIT: '53686ba34f9e8852cbe1970666a5f56fd6abf75a'
  LOGIC_TEST_COMMIT: '795f13ba445bb09ceb0991c417eb2612dbbd9a2c'
  # Universal Tracker v0.3.4's commit: its release's tracker.apworld, which development.md names, holds this folder.
  TRACKER_COMMIT: 'b33d2eafaf94e64de90fc7cd71bc915524816eb2'

jobs:
  apworld:
    name: Apworld on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The versions Archipelago's own CI tests at this tag.
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bug_fables_ap

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ArchipelagoMW/Archipelago
          ref: ${{ env.AP_TAG }}
          path: Archipelago

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            Archipelago/requirements.txt
            Archipelago/ci-requirements.txt
            Archipelago/WebHostLib/requirements.txt
            Archipelago/worlds/*/requirements.txt

      # The same install as Archipelago's own unittests workflow, WebHost's packages included: some general tests
      # render the world's docs and options on the website.
      - name: Install Archipelago with the world
        working-directory: Archipelago
        run: |
          cp -r ../bug_fables_ap/apworld/bug_fables worlds/bug_fables
          cp ../bug_fables_ap/LICENSE worlds/bug_fables/LICENSE
          python -m pip install --upgrade pip
          pip install -r ci-requirements.txt
          python ModuleUpdate.py --yes --force --append "WebHostLib/requirements.txt"
          # Installed once; after this, a clash between other worlds' pins would stop at a press-Enter prompt.
          echo "SKIP_REQUIREMENTS_UPDATE=1" >> "$GITHUB_ENV"
          SKIP_REQUIREMENTS_UPDATE=1 python Launcher.py --update_settings

      # Our tests and Archipelago's general ones, scoped to this world (tests.md, "Running Tests for Specific Worlds").
      - name: Tests
        working-directory: Archipelago
        run: AP_TEST_WORLDS=bug_fables pytest -n auto

      # Some failures only show in a room with two different games.
      - name: Generate with a second game
        working-directory: Archipelago
        run: |
          set -e
          presets=(
            '{}'
            '{"entrance_randomizer": "coupled", "enemy_shuffle": "enemies_only", "starting_location": "anywhere", "shuffle_discoveries": true}'
            '{"shuffle_quests": false, "shuffle_crystal_berries": false, "shuffle_medal_shops": false, "shuffle_item_shops": false, "shop_contents": "filler_only"}'
          )
          for i in "${!presets[@]}"; do
            dir="$RUNNER_TEMP/gen$i"; mkdir -p "$dir/players" "$dir/out"
            printf 'name: BugTester\ngame: Bug Fables\nBug Fables: %s\n' "${presets[$i]}" > "$dir/players/bf.yaml"
            printf 'name: QuestTester\ngame: APQuest\nAPQuest: {}\n' > "$dir/players/aq.yaml"
            python Generate.py --player_files_path "$dir/players" --outputpath "$dir/out" --seed "$((i + 1))"
            ls "$dir/out"/AP_*.zip
          done

  # Its own job, not a matrix leg's extra steps: a changed matrix can't silently stop making the release's files.
  build:
    name: Build the apworld and its yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bug_fables_ap

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ArchipelagoMW/Archipelago
          ref: ${{ env.AP_TAG }}
          path: Archipelago

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            Archipelago/requirements.txt
            Archipelago/ci-requirements.txt
            Archipelago/worlds/*/requirements.txt

      - name: Install Archipelago with the world
        working-directory: Archipelago
        run: |
          cp -r ../bug_fables_ap/apworld/bug_fables worlds/bug_fables
          cp ../bug_fables_ap/LICENSE worlds/bug_fables/LICENSE
          python -m pip install --upgrade pip
          pip install -r ci-requirements.txt
          python ModuleUpdate.py --yes --force
          echo "SKIP_REQUIREMENTS_UPDATE=1" >> "$GITHUB_ENV"
          SKIP_REQUIREMENTS_UPDATE=1 python Launcher.py --update_settings

      - name: Build the apworld and its yaml
        working-directory: Archipelago
        run: |
          set -e
          python Launcher.py "Build APWorlds" -- "Bug Fables"
          python Launcher.py "Generate Template Options" -- --skip_open_folder
          mkdir -p ../dist
          cp build/apworlds/bug_fables.apworld ../dist/bug_fables.apworld
          # GitHub turns spaces in asset names into dots.
          cp "Players/Templates/Bug Fables.yaml" ../dist/bug_fables.yaml
          unzip -p ../dist/bug_fables.apworld bug_fables/archipelago.json

      # What a player does: the built apworld in custom_worlds, the template as their yaml, no loose world.
      - name: Generate from the built apworld and yaml
        working-directory: Archipelago
        run: |
          set -e
          rm -rf worlds/bug_fables
          cp ../dist/bug_fables.apworld custom_worlds/
          dir="$RUNNER_TEMP/player"; mkdir -p "$dir/players" "$dir/out"
          cp ../dist/bug_fables.yaml "$dir/players/"
          printf 'name: QuestTester\ngame: APQuest\nAPQuest: {}\n' > "$dir/players/aq.yaml"
          python Generate.py --player_files_path "$dir/players" --outputpath "$dir/out"
          ls "$dir/out"/AP_*.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apworld
          path: dist/
          if-no-files-found: error

  # test-apworld.ps1, as run locally: the tests, the Logic Test check, then 10000 fuzzed seeds, in five shards of 2000
  # that run side by side (each draws its own seeds); the first also runs the tests and the Logic Test check. One
  # Python: the matrix covers all three.
  fuzz:
    name: Fuzzer shard ${{ matrix.shard }} of 5${{ matrix.shard == 1 && ', tests and Logic Test check' || '' }}
    runs-on: ubuntu-latest
    # Inside release.ps1's 40-minute wait for CI.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bug_fables_ap

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ArchipelagoMW/Archipelago
          ref: ${{ env.AP_TAG }}
          path: Archipelago

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Eijebong/Archipelago-fuzzer
          ref: ${{ env.FUZZER_COMMIT }}
          path: fuzzer

      # Only the Logic Test's folder, from a fork of all of Archipelago.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: palex00/Archipelago
          ref: ${{ env.LOGIC_TEST_COMMIT }}
          path: logic-test
          sparse-checkout: worlds/logic_test

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            Archipelago/requirements.txt
            Archipelago/ci-requirements.txt
            Archipelago/worlds/*/requirements.txt

      - name: Install Archipelago with the world, the Logic Test and the fuzzer
        working-directory: Archipelago
        run: |
          cp -r ../bug_fables_ap/apworld/bug_fables worlds/bug_fables
          cp -r ../logic-test/worlds/logic_test worlds/logic_test
          cp ../fuzzer/fuzz.py fuzz.py
          python -m pip install --upgrade pip
          pip install -r ci-requirements.txt
          python ModuleUpdate.py --yes --force
          echo "SKIP_REQUIREMENTS_UPDATE=1" >> "$GITHUB_ENV"
          SKIP_REQUIREMENTS_UPDATE=1 python Launcher.py --update_settings

      - name: The fuzzer (shard 1 adds the tests and the Logic Test check)
        shell: pwsh
        working-directory: Archipelago
        env:
          SHARD: ${{ matrix.shard }}
        run: ../bug_fables_ap/dev-scripts/test-apworld.ps1 -Archipelago . -Runs 2000 -FuzzOnly:($env:SHARD -ne '1')

      # Each failed run's yaml and log, to regenerate locally (development.md, Fuzzing the apworld).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-failures-${{ matrix.shard }}
          path: Archipelago/fuzz_output/
          if-no-files-found: ignore
          retention-days: 14

  # test-apworld.ps1 -TrackerOnly: 10000 fuzzed seeds, each regenerated from its slot_data with no yaml as Universal
  # Tracker does, and checked sphere by sphere, in five shards of 2000 beside the fuzz shards.
  tracker:
    name: Universal Tracker's fuzzer hook, shard ${{ matrix.shard }} of 5
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bug_fables_ap

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ArchipelagoMW/Archipelago
          ref: ${{ env.AP_TAG }}
          path: Archipelago

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Eijebong/Archipelago-fuzzer
          ref: ${{ env.FUZZER_COMMIT }}
          path: fuzzer

      # Only Universal Tracker's folder, from its fork of all of Archipelago.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FarisTheAncient/Archipelago
          ref: ${{ env.TRACKER_COMMIT }}
          path: tracker
          sparse-checkout: worlds/tracker

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            Archipelago/requirements.txt
            Archipelago/ci-requirements.txt
            Archipelago/worlds/*/requirements.txt

      # Players: Universal Tracker's players folder, which it requires and a fresh checkout doesn't have.
      - name: Install Archipelago with the world, Universal Tracker and the fuzzer
        working-directory: Archipelago
        run: |
          cp -r ../bug_fables_ap/apworld/bug_fables worlds/bug_fables
          cp -r ../tracker/worlds/tracker worlds/tracker
          cp ../fuzzer/fuzz.py fuzz.py
          mkdir -p Players
          python -m pip install --upgrade pip
          pip install -r ci-requirements.txt
          python ModuleUpdate.py --yes --force
          echo "SKIP_REQUIREMENTS_UPDATE=1" >> "$GITHUB_ENV"
          SKIP_REQUIREMENTS_UPDATE=1 python Launcher.py --update_settings

      - name: Universal Tracker's fuzzer hook
        shell: pwsh
        working-directory: Archipelago
        run: ../bug_fables_ap/dev-scripts/test-apworld.ps1 -Archipelago . -TrackerOnly -TrackerRuns 2000

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: tracker-fuzz-failures-${{ matrix.shard }}
          path: Archipelago/fuzz_output_tracker/
          if-no-files-found: ignore
          retention-days: 14
